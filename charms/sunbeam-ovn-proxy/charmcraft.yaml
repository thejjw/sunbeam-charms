type: charm
name: sunbeam-ovn-proxy
title: Sunbeam OVN Proxy
summary: Relation proxy between ovsdb and ovsdb-cms.
description: |
  The goal of this charm is to act as a relation proxy between
  the ovsdb-cms relation and the ovsdb relation. This is needed
  because MicroOVN only provides OVSDB interface, while Sunbeam
  charms need more information that is provided by the ovsdb-cms
  relation.

platforms:
  noble-amd64:
    build-on: [ubuntu@24.04:amd64]
    build-for: [ubuntu@24.04:amd64]
  noble-arm64:
    build-on: [ubuntu@24.04:arm64]
    build-for: [ubuntu@24.04:arm64]
  noble-s390x:
    build-on: [ubuntu@24.04:s390x]
    build-for: [ubuntu@24.04:s390x]
  resolute-amd64:
    build-on: [ubuntu@26.04:amd64]
    build-for: [ubuntu@26.04:amd64]
  resolute-arm64:
    build-on: [ubuntu@26.04:arm64]
    build-for: [ubuntu@26.04:arm64]
  resolute-s390x:
    build-on: [ubuntu@26.04:s390x]
    build-for: [ubuntu@26.04:s390x]

parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv
    build-packages:
      - git
      - gcc
      - python3-dev
      # s390x: build cryptography (openssl-sys/Rust) from source
      - libssl-dev
      - pkg-config
      - rustc-1.91
      - cargo-1.91
requires:
  ovsdb:
    interface: ovsdb
    limit: 1
  tracing:
    interface: tracing
    optional: true
    limit: 1

provides:
  ovsdb-cms:
    interface: ovsdb-cms
