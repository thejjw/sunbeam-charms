type: charm
title: Sunbeam Machine
name: sunbeam-machine
summary: Manage sunbeam utilities in OpenStack deployment
description: |
  Manage machine configuration for sunbeam deployment

platforms:
  noble-amd64:
    build-on: [ubuntu@24.04:amd64]
    build-for: [ubuntu@24.04:amd64]
  noble-arm64:
    build-on: [ubuntu@24.04:arm64]
    build-for: [ubuntu@24.04:arm64]
  noble-s390x:
    build-on: [ubuntu@24.04:s390x]
    build-for: [ubuntu@24.04:s390x]
  resolute-amd64:
    build-on: [ubuntu@26.04:amd64]
    build-for: [ubuntu@26.04:amd64]
  resolute-arm64:
    build-on: [ubuntu@26.04:arm64]
    build-for: [ubuntu@26.04:arm64]
  resolute-s390x:
    build-on: [ubuntu@26.04:s390x]
    build-for: [ubuntu@26.04:s390x]

config:
  options:
    debug:
      default: false
      type: boolean
    http_proxy:
      description: Set HTTP_PROXY in /etc/environment
      type: string
    https_proxy:
      description: Set HTTPS_PROXY in /etc/environment
      type: string
    no_proxy:
      description: Set NO_PROXY in /etc/environment
      type: string

provides:
  sunbeam-machine:
    interface: sunbeam-machine

requires:
  tracing:
    interface: tracing
    optional: true
    limit: 1

parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv
    build-packages:
      - git
      - gcc
      - python3-dev
      # s390x: build cryptography (openssl-sys/Rust) from source
      - libssl-dev
      - pkg-config
      - rustc-1.91
      - cargo-1.91
