type: charm
title: Cloudkitty
name: cloudkitty-k8s
summary: Openstack Rating service
description: |
  Cloudkitty is the OpenStack Rating service.
  It provides a framework for metering and rating cloud resources.
assumes:
  - k8s-api
  - juju >= 3.1
links:
  source:
    - https://opendev.org/openstack/charm-cloudkitty-k8s
  issues:
    - https://bugs.launchpad.net/charm-cloudkitty-k8s

base: ubuntu@26.04
platforms:
  amd64:
  arm64:
  s390x:

config:
  options:
    debug:
      default: false
      description: Enable debug logging.
      type: boolean
    region:
      default: RegionOne
      description: Name of the OpenStack region
      type: string

actions:
  validate-config-overrides:
    description: |
      Validate a service configuration override file without applying it.
    params:
      content:
        type: string
        default: ""
        description: Override file content to validate.
  get-config-overrides:
    description: Report the service configuration overrides in effect.
  apply-config-overrides:
    description: Validate the attached override resources and apply them now.
  pause:
    description: Pause container services
    additionalProperties: false
  resume:
    description: Resume container services
    additionalProperties: false

containers:
  cloudkitty:
    resource: cloudkitty-image

resources:
  cloudkitty-image:
    type: oci-image
    description: OCI image for OpenStack Cloudkitty
    upstream-source: ghcr.io/canonical/cloudkitty-consolidated:2026.2-26.04_edge
  config-override:
    type: file
    filename: override.conf
    description: Optional oslo.config drop-in override for cloudkitty.
  policy-override:
    type: file
    filename: override.yaml
    description: Optional oslo.policy override for cloudkitty.

requires:
  ingress-internal:
    interface: ingress
    limit: 1
  ingress-public:
    interface: ingress
    optional: true
    limit: 1
  database:
    interface: mysql_client
    limit: 1
  identity-service:
    interface: keystone
    limit: 1
  gnocchi-db:
    interface: gnocchi
  amqp:
    interface: rabbitmq
  receive-ca-cert:
    interface: certificate_transfer
    optional: true
  logging:
    interface: loki_push_api
    optional: true
  tracing:
    interface: tracing
    optional: true
    limit: 1

peers:
  peers:
    interface: cloudkitty-peer

parts:
  update-certificates:
    plugin: nil
    override-build: |
      apt update
      apt install -y ca-certificates
      update-ca-certificates
  charm:
    after:
      - update-certificates
    plugin: uv
    source: .
    build-snaps:
      - astral-uv
    build-packages:
      - git
      # s390x: build cryptography (openssl-sys/Rust) from source
      - libssl-dev
      - pkg-config
      - rustc
      - cargo
