type: charm
title: Neutron Baremetal Switch Config
name: neutron-baremetal-switch-config-k8s
summary: OpenStack Neutron Baremetal Switch Config Charm
description: |
  neutron-baremetal-switch-config-k8s is a config charm for the OpenStack
  neutron-k8s charm, providing it with necessary details for its
  ml2_conf_networking_baremetal.ini config file.
assumes:
  - k8s-api
  - juju >= 3.1
links:
  source: https://opendev.org/openstack/sunbeam-charms
  issues: https://bugs.launchpad.net/sunbeam-charms

platforms:
  noble-amd64:
    build-on: [ubuntu@24.04:amd64]
    build-for: [ubuntu@24.04:amd64]
  noble-arm64:
    build-on: [ubuntu@24.04:arm64]
    build-for: [ubuntu@24.04:arm64]
  noble-s390x:
    build-on: [ubuntu@24.04:s390x]
    build-for: [ubuntu@24.04:s390x]
  resolute-amd64:
    build-on: [ubuntu@26.04:amd64]
    build-for: [ubuntu@26.04:amd64]
  resolute-arm64:
    build-on: [ubuntu@26.04:arm64]
    build-for: [ubuntu@26.04:arm64]
  resolute-s390x:
    build-on: [ubuntu@26.04:s390x]
    build-for: [ubuntu@26.04:s390x]

config:
  options:
    debug:
      default: false
      type: boolean
      description: Enable debug logging.
    conf-secrets:
      default: ""
      type: string
      description: Juju secrets containing baremetal switch config.

requires:
  logging:
    interface: loki_push_api
    optional: true
    limit: 1

provides:
  switch-config:
    interface: switch-config

parts:
  update-certificates:
    plugin: nil
    override-build: |
      apt update
      apt install -y ca-certificates
      update-ca-certificates
  charm:
    after:
      - update-certificates
    plugin: uv
    source: .
    build-snaps:
      - astral-uv
    build-packages:
      - git
      # s390x: build cryptography (openssl-sys/Rust) from source
      - libssl-dev
      - pkg-config
      - rustc-1.91
      - cargo-1.91
