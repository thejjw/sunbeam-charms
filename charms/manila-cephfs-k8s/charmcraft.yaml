type: charm
title: OpenStack manila share service
name: manila-cephfs-k8s
summary: OpenStack shared filesystems service - Ceph backend
description: |
  Manila is the OpenStack project that provides shared filesystems as a
  service for instances. This charm provides integration with Ceph storage
  backends.
assumes:
  - k8s-api
  - juju >= 3.1
links:
  source: https://opendev.org/openstack/sunbeam-charms
  issues: https://bugs.launchpad.net/sunbeam-charms

platforms:
  noble-amd64:
    build-on: [ubuntu@24.04:amd64]
    build-for: [ubuntu@24.04:amd64]
  noble-arm64:
    build-on: [ubuntu@24.04:arm64]
    build-for: [ubuntu@24.04:arm64]
  noble-s390x:
    build-on: [ubuntu@24.04:s390x]
    build-for: [ubuntu@24.04:s390x]
  resolute-amd64:
    build-on: [ubuntu@26.04:amd64]
    build-for: [ubuntu@26.04:amd64]
  resolute-arm64:
    build-on: [ubuntu@26.04:arm64]
    build-for: [ubuntu@26.04:arm64]
  resolute-s390x:
    build-on: [ubuntu@26.04:s390x]
    build-for: [ubuntu@26.04:s390x]

config:
  options:
    debug:
      default: false
      description: Enable debug logging.
      type: boolean
    region:
      default: RegionOne
      description: Name of the OpenStack region
      type: string

containers:
  manila-share:
    resource: manila-share-image

resources:
  manila-share-image:
    type: oci-image
    description: OCI image for OpenStack Manila share
    upstream-source: ghcr.io/canonical/manila-share:2026.1-24.04_edge

requires:
  amqp:
    interface: rabbitmq
    limit: 1
  ceph-nfs:
    interface: ceph-nfs-client
    limit: 1
  database:
    interface: mysql_client
    limit: 1
  identity-credentials:
    interface: keystone-credentials
    limit: 1
  logging:
    interface: loki_push_api
    optional: true
    limit: 1
  tracing:
    interface: tracing
    optional: true
    limit: 1

provides:
  manila:
    interface: manila-backend

parts:
  update-certificates:
    plugin: nil
    override-build: |
      apt update
      apt install -y ca-certificates
      update-ca-certificates
  charm:
    after:
      - update-certificates
    plugin: uv
    source: .
    build-snaps:
      - astral-uv
    build-packages:
      - git
      # s390x: build cryptography (openssl-sys/Rust) from source
      - libssl-dev
      - pkg-config
      - rustc-1.91
      - cargo-1.91
