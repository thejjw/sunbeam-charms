type: charm
name: openstack-network-agents
title: OpenStack Network Agents (subordinate)
summary: Subordinate charm to drive the openstack-network-agents snap
description: |
  Installs and configures the 'openstack-network-agents' snap, sets up the
  provider bridge/physnet mapping and optional dynamic routing agents.
  Attach this charm to MicroOVN units to provide north/south traffic.

subordinate: true

platforms:
  noble-amd64:
    build-on: [ubuntu@24.04:amd64]
    build-for: [ubuntu@24.04:amd64]
  noble-arm64:
    build-on: [ubuntu@24.04:arm64]
    build-for: [ubuntu@24.04:arm64]
  noble-s390x:
    build-on: [ubuntu@24.04:s390x]
    build-for: [ubuntu@24.04:s390x]
  resolute-amd64:
    build-on: [ubuntu@26.04:amd64]
    build-for: [ubuntu@26.04:amd64]
  resolute-arm64:
    build-on: [ubuntu@26.04:arm64]
    build-for: [ubuntu@26.04:arm64]
  resolute-s390x:
    build-on: [ubuntu@26.04:s390x]
    build-for: [ubuntu@26.04:s390x]

requires:
  juju-info:
    interface: juju-info
    scope: container
  amqp:
    interface: rabbitmq
    optional: true
    limit: 1

provides:
  cos-agent:
    interface: cos_agent
    limit: 1

extra-bindings:
  data: null

config:
  options:
    snap-name:
      type: string
      default: openstack-network-agents
      description: Name of the snap to install.
    snap-channel:
      type: string
      default: latest/edge
      description: |
        Snap channel to track. A risk change within the same track (e.g.
        stable to candidate) refreshes the snap on the next hook run.
        A track change does NOT refresh the snap from a hook — use the
        refresh-snap action (optionally with a channel parameter).
    external-bridge-address:
      default: 0.0.0.0/0
      type: string
      description: |
        CIDR range for the provider bridge's IP address. This is only useful
        in local networking mode.
    debug:
      type: boolean
      default: false
    use-data-binding:
      default: false
      type: boolean
      description: |
        When true, resolve the data-plane IP from the 'data'
        extra-binding and pass it to the snap as network.ip-address.

actions:
  validate-dynamic-routing-instances:
    description: Validate a complete per-unit dynamic routing placement without applying it.
    params:
      contract-version:
        type: integer
        description: Version of the per-unit dynamic routing placement contract.
      instances:
        type: string
        description: JSON array of resolved instances with their peering attachments.
    required: [contract-version, instances]
    additionalProperties: false
  set-dynamic-routing-instances:
    description: Replace the desired list of dynamic routing agents on this unit.
    params:
      contract-version:
        type: integer
        description: Version of the per-unit dynamic routing placement contract.
      instances:
        type: string
        description: |
          JSON array of instances with domain, family (ipv4 or ipv6),
          service-name, host, router-id (an IPv4 address), and peering fields.
          An empty array removes all local instances.
          Without AMQP credentials, the snap saves the placement and
          keeps the agents stopped.
    required: [contract-version, instances]
    additionalProperties: false
  set-network-agents-local-settings:
    description: |
      Apply settings specific to this unit for provider networking.
    params:
      external-interface:
        type: string
        description: |
          (Deprecated) Physical NIC to add as a bridge port (e.g. enp6s0).
      bridge-name:
        type: string
        description: |
          (Deprecated) Provider bridge name.
      physnet-name:
        type: string
        description: |
          (Deprecated) OVN physnet label.
      enable-chassis-as-gw:
        type: boolean
        description: |
          If true, set ovn-cms-options=enable-chassis-as-gw so L3 gateway roles
          prefer scheduling here.
      bridge-mapping:
        type: string
        description: |
          Space separated list of bridge:physnet:iface mappings. (br-ex:physnet1:ens3 ...)
    additionalProperties: false
  list-nics:
    description: |
      List host NICS, and which one are candidates for use as external NIC.
    additionalProperties: false
  refresh-snap:
    description: |
      Refresh the snap to the latest available revision on the configured
      channel. The snap is held after installation to prevent automatic
      refreshes; use this action to apply updates explicitly. Overrides
      the snap-channel config for this refresh if specified.
    params:
      channel:
        type: string
        description: Channel override for this refresh; defaults to snap-channel.

parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv
    build-packages:
      - git
      # s390x: build cryptography (openssl-sys/Rust) from source
      - libssl-dev
      - pkg-config
      - rustc-1.91
      - cargo-1.91
