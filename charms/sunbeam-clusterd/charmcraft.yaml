type: charm
title: Sunbeam Clusterd
name: sunbeam-clusterd
summary: A juju charm to run sunbeam clusterd
description: |
  Manage sunbeam clusterd deployment

base: ubuntu@24.04
platforms:
  amd64:
  arm64:
  s390x:

config:
  options:
    snap-channel:
      default: 2026.1/edge
      type: string
      description: |
        Snap channel to track. A risk change within the same track (e.g.
        stable to candidate) refreshes the snap on the next hook run.
        A track change does NOT refresh the snap from a hook — use the
        refresh-snap action (optionally with a channel parameter).
    debug:
      default: false
      type: boolean

actions:
  get-credentials:
    description: |
      Return information necessary to connect to clusterd.
  refresh-snap:
    description: |
      Refresh the openstack snap to the latest available revision on the
      configured channel. The snap is held after installation to prevent
      automatic refreshes; use this action to apply updates explicitly.
      Overrides the snap-channel config for this refresh if specified.
    params:
      channel:
        type: string
        description: Channel override for this refresh; defaults to snap-channel.

requires:
  certificates:
    interface: tls-certificates
    optional: true
  tracing:
    interface: tracing
    optional: true
    limit: 1

peers:
  peers:
    interface: clusterd-peer

parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv
    build-packages:
      - git
      # s390x: build cryptography (openssl-sys/Rust) from source
      - libssl-dev
      - pkg-config
      - rustc-1.82
      - cargo-1.82
