type: charm
name: ceilometer-k8s
summary: OpenStack ceilometer service
description: |
  OpenStack ceilometer provides an HTTP service for managing, selecting,
  and claiming providers of classes of inventory representing available
  resources in a cloud.
  .
assumes:
  - k8s-api
  - juju >= 3.1
links:
  source:
    - https://opendev.org/openstack/charm-ceilometer-k8s
  issues:
    - https://bugs.launchpad.net/charm-ceilometer-k8s

platforms:
  noble-amd64:
    build-on: [ubuntu@24.04:amd64]
    build-for: [ubuntu@24.04:amd64]
  noble-arm64:
    build-on: [ubuntu@24.04:arm64]
    build-for: [ubuntu@24.04:arm64]
  noble-s390x:
    build-on: [ubuntu@24.04:s390x]
    build-for: [ubuntu@24.04:s390x]
  resolute-amd64:
    build-on: [ubuntu@26.04:amd64]
    build-for: [ubuntu@26.04:amd64]
  resolute-arm64:
    build-on: [ubuntu@26.04:arm64]
    build-for: [ubuntu@26.04:arm64]
  resolute-s390x:
    build-on: [ubuntu@26.04:s390x]
    build-for: [ubuntu@26.04:s390x]

config:
  options:
    debug:
      default: false
      description: Enable debug logging.
      type: boolean
    region:
      default: RegionOne
      description: Name of the OpenStack region
      type: string

containers:
  ceilometer-central:
    resource: ceilometer-central-image
  ceilometer-notification:
    resource: ceilometer-notification-image

resources:
  ceilometer-central-image:
    type: oci-image
    description: OCI image for OpenStack ceilometer central
    upstream-source: ghcr.io/canonical/ceilometer-consolidated:2026.1-24.04_edge
  ceilometer-notification-image:
    type: oci-image
    description: OCI image for OpenStack ceilometer
    upstream-source: ghcr.io/canonical/ceilometer-consolidated:2026.1-24.04_edge

requires:
  amqp:
    interface: rabbitmq
  identity-credentials:
    interface: keystone-credentials
    limit: 1
  gnocchi-db:
    interface: gnocchi
  receive-ca-cert:
    interface: certificate_transfer
    optional: true
  logging:
    interface: loki_push_api
    optional: true
  tracing:
    interface: tracing
    optional: true
    limit: 1

provides:
  ceilometer-service:
    interface: ceilometer

peers:
  peers:
    interface: ceilometer-peer

parts:
  update-certificates:
    plugin: nil
    override-build: |
      apt update
      apt install -y ca-certificates
      update-ca-certificates
  charm:
    after:
      - update-certificates
    plugin: uv
    source: .
    build-snaps:
      - astral-uv
    build-packages:
      - git
      # s390x: build cryptography (openssl-sys/Rust) from source
      - libssl-dev
      - pkg-config
      - rustc-1.91
      - cargo-1.91
