type: charm
title: OpenStack Images Sync K8S
name: openstack-images-sync-k8s
summary: Keep OpenStack images in sync with the latest versions
description: |
  Openstack Images Sync operator allows synchronization from a SimpleStreams source to an OpenStack cloud.

platforms:
  noble-amd64:
    build-on: [ubuntu@24.04:amd64]
    build-for: [ubuntu@24.04:amd64]
  noble-arm64:
    build-on: [ubuntu@24.04:arm64]
    build-for: [ubuntu@24.04:arm64]
  noble-s390x:
    build-on: [ubuntu@24.04:s390x]
    build-for: [ubuntu@24.04:s390x]
  resolute-amd64:
    build-on: [ubuntu@26.04:amd64]
    build-for: [ubuntu@26.04:amd64]
  resolute-arm64:
    build-on: [ubuntu@26.04:arm64]
    build-for: [ubuntu@26.04:arm64]
  resolute-s390x:
    build-on: [ubuntu@26.04:s390x]
    build-for: [ubuntu@26.04:s390x]

config:
  options:
    debug:
      default: false
      type: boolean
    frequency:
      default: hourly
      description: |
        The frequency at which the charm should check for new images.
        Valid values are hourly, daily, weekly.
      type: string
    architecture:
      default: amd64
      description: |
        The architectures to sync images for. Space delimited list of architectures.
      type: string
    release:
      default: focal jammy noble
      description: |
        The releases to sync images for. Space delimited list of releases.
      type: string
    cloud-name:
      default: microstack
      description: |
        The name of the cloud to sync images for.
      type: string
    max-items:
      default: 1
      description: |
        The maximum number of images to keep in sync per version.
      type: int
    region:
      default: RegionOne
      description: Name of the OpenStack region
      type: string

actions:
  pause:
    description: Pause container services
    additionalProperties: false
  resume:
    description: Resume container services
    additionalProperties: false

containers:
  openstack-images-sync:
    resource: openstack-images-sync-image

resources:
  openstack-images-sync-image:
    type: oci-image
    description: OCI image for OpenStack Images Sync
    upstream-source: ghcr.io/canonical/openstack-images-sync:2026.1-24.04_edge

requires:
  ingress-internal:
    interface: ingress
    limit: 1
  ingress-public:
    interface: ingress
    optional: true
    limit: 1
  identity-service:
    interface: keystone
  logging:
    interface: loki_push_api
    optional: true
  tracing:
    interface: tracing
    optional: true
    limit: 1
  receive-ca-cert:
    interface: certificate_transfer
    optional: true

parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv
    build-packages:
      - git
      # s390x: build cryptography (openssl-sys/Rust) from source
      - libssl-dev
      - pkg-config
      - rustc-1.91
      - cargo-1.91
