type: charm
name: cinder-volume
summary: OpenStack volume service
description: |
  Cinder is the OpenStack project that provides volume management for
  instances. This charm provides Cinder Volume service.
assumes:
  - juju >= 3.1
links:
  source:
    - https://opendev.org/openstack/sunbeam-charms
  issues:
    - https://bugs.launchpad.net/sunbeam-charms

base: ubuntu@24.04
platforms:
  amd64:
  arm64:
  s390x:

config:
  options:
    debug:
      type: boolean
      default: false
      description: Enable debug logging.
    snap-name:
      default: cinder-volume
      type: string
      description: Name of the snap to install.
    snap-channel:
      default: 2026.1/edge
      type: string
    rabbit-user:
      type: string
      default: null
      description: Username to request access on rabbitmq-server.
    rabbit-vhost:
      type: string
      default: null
      description: RabbitMQ virtual host to request access on rabbitmq-server.
    enable-telemetry-notifications:
      type: boolean
      default: false
      description: Enable notifications to send to telemetry.
    image-volume-cache-enabled:
      type: boolean
      default: false
      description: |
        Enable the image volume cache.
    image-volume-cache-max-size-gb:
      type: int
      default: 0
      description: |
        Max size of the image volume cache in GB. 0 means unlimited.
    image-volume-cache-max-count:
      type: int
      default: 0
      description: |
        Max number of entries allowed in the image volume cache. 0 means
        unlimited.
    default-volume-type:
      type: string
      default: null
      description: |
        Default volume type to use when creating volumes.
    experimental-devmode:
      type: boolean
      default: false
      description: |
        Temporary flag to enable devmode snap install. This is needed
        until cinder-volume interfaces are all stable.

requires:
  amqp:
    interface: rabbitmq
  database:
    interface: mysql_client
    limit: 1
  identity-credentials:
    interface: keystone-credentials
  receive-ca-cert:
    interface: certificate_transfer
    optional: true
  tracing:
    interface: tracing
    optional: true
    limit: 1

provides:
  storage-backend:
    interface: cinder-backend
  cinder-volume:
    interface: cinder-volume

actions:
  refresh-snap:
    description: |
      Refresh the snap to the latest available revision on the configured
      channel. The snap is held after installation to prevent automatic
      refreshes; use this action to apply updates explicitly.
  pre-upgrade:
    description: |
      Prepare the charm for an upgrade.
      Run this action on the leader before upgrading the charm to a new channel.
  post-upgrade:
    description: |
      Clean up after an upgrade.
      Run this action on the leader after all units are healthy at the new version.
  rpc-cache-refresh:
    description: |
      SIGHUP cinder-volume to clear the cached RPC version cap.
      After a SLURP upgrade, cinder-volume holds a stale cap pinned to the
      previous release. This action triggers cinder's reset() to re-query the
      services table and pick up the new minimum version. Zero-downtime.
      Run this action on every unit: each unit's cinder-volume holds its own
      cached cap, so running it on the leader alone is not sufficient.

parts:
  update-certificates:
    plugin: nil
    override-build: |
      apt update
      apt install -y ca-certificates
      update-ca-certificates
  charm:
    after:
      - update-certificates
    plugin: uv
    source: .
    build-snaps:
      - astral-uv
    build-packages:
      - git
      # s390x: build cryptography (openssl-sys/Rust) from source
      - libssl-dev
      - pkg-config
      - rustc-1.82
      - cargo-1.82
