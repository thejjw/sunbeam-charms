type: charm
name: cinder-k8s
summary: OpenStack volume service
description: |
  Cinder is the OpenStack project that provides volume management for
  instances.
assumes:
  - k8s-api
  - juju >= 3.1
links:
  source:
    - https://opendev.org/openstack/charm-cinder-k8s
  issues:
    - https://bugs.launchpad.net/charm-cinder-k8s

base: ubuntu@26.04
platforms:
  amd64:
  arm64:
  s390x:

config:
  options:
    debug:
      default: false
      description: Enable debug logging.
      type: boolean
    enable-telemetry-notifications:
      type: boolean
      default: false
      description: Enable notifications to send to telemetry.
    region:
      default: RegionOne
      description: Name of the OpenStack region
      type: string

actions:
  pause:
    description: Pause container services
    additionalProperties: false
  resume:
    description: Resume container services
    additionalProperties: false
  rpc-cache-refresh:
    description: |
      SIGHUP cinder-scheduler to clear the cached RPC version cap.
      After a SLURP upgrade, the scheduler holds a stale cap pinned to the
      previous release. This action triggers cinder's reset() to re-query the
      services table and pick up the new minimum version. Zero-downtime.
      Run this action on every unit: each unit's cinder-scheduler holds its
      own cached cap, so running it on the leader alone is not sufficient.

containers:
  cinder-api:
    resource: cinder-api-image
  cinder-scheduler:
    resource: cinder-scheduler-image

resources:
  cinder-api-image:
    type: oci-image
    description: OCI image for OpenStack Cinder API
    upstream-source: ghcr.io/canonical/cinder-consolidated:2026.2-26.04_edge
  cinder-scheduler-image:
    type: oci-image
    description: OCI image for OpenStack Cinder Scheduler
    upstream-source: ghcr.io/canonical/cinder-consolidated:2026.2-26.04_edge

requires:
  database:
    interface: mysql_client
    limit: 1
  ingress-internal:
    interface: ingress
    limit: 1
  ingress-public:
    interface: ingress
    optional: true
    limit: 1
  identity-service:
    interface: keystone
    limit: 1
  amqp:
    interface: rabbitmq
  storage-backend:
    interface: cinder-backend
  image-service:
    interface: glance
    optional: true
  receive-ca-cert:
    interface: certificate_transfer
    optional: true
  logging:
    interface: loki_push_api
    optional: true
  tracing:
    interface: tracing
    optional: true
    limit: 1

peers:
  peers:
    interface: cinder-peer

parts:
  update-certificates:
    plugin: nil
    override-build: |
      apt update
      apt install -y ca-certificates
      update-ca-certificates
  charm:
    after:
      - update-certificates
    plugin: uv
    source: .
    build-snaps:
      - astral-uv
    build-packages:
      - git
      # s390x: build cryptography (openssl-sys/Rust) from source
      - libssl-dev
      - pkg-config
      - rustc
      - cargo
