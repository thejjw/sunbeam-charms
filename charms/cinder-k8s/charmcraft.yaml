type: charm
name: cinder-k8s
summary: OpenStack volume service
description: |
  Cinder is the OpenStack project that provides volume management for
  instances.
assumes:
  - k8s-api
  - juju >= 3.1
links:
  source:
    - https://opendev.org/openstack/charm-cinder-k8s
  issues:
    - https://bugs.launchpad.net/charm-cinder-k8s

base: ubuntu@24.04
platforms:
  amd64:
  arm64:
  s390x:

config:
  options:
    debug:
      default: false
      description: Enable debug logging.
      type: boolean
    enable-telemetry-notifications:
      type: boolean
      default: false
      description: Enable notifications to send to telemetry.
    region:
      default: RegionOne
      description: Name of the OpenStack region
      type: string

actions:
  pre-upgrade:
    description: |
      Reduce ingress health check interval before an upgrade.
      Run this action on the leader before refreshing the charm to a new channel.
      Traefik will detect dead/alive backends in ~3s instead of ~30s, reducing
      API downtime during the rolling pod restarts.
  post-upgrade:
    description: |
      Restore ingress health check interval to steady-state after an upgrade.
      Run this action on the leader after all units are healthy at the new version.

containers:
  cinder-api:
    resource: cinder-api-image
  cinder-scheduler:
    resource: cinder-scheduler-image

resources:
  cinder-api-image:
    type: oci-image
    description: OCI image for OpenStack Cinder API
    upstream-source: ghcr.io/canonical/cinder-consolidated:2026.1-24.04_edge
  cinder-scheduler-image:
    type: oci-image
    description: OCI image for OpenStack Cinder Scheduler
    upstream-source: ghcr.io/canonical/cinder-consolidated:2026.1-24.04_edge

requires:
  database:
    interface: mysql_client
    limit: 1
  ingress-internal:
    interface: ingress
    limit: 1
  ingress-public:
    interface: ingress
    optional: true
    limit: 1
  identity-service:
    interface: keystone
    limit: 1
  amqp:
    interface: rabbitmq
  storage-backend:
    interface: cinder-backend
  image-service:
    interface: glance
    optional: true
  receive-ca-cert:
    interface: certificate_transfer
    optional: true
  logging:
    interface: loki_push_api
    optional: true
  tracing:
    interface: tracing
    optional: true
    limit: 1

peers:
  peers:
    interface: cinder-peer

parts:
  update-certificates:
    plugin: nil
    override-build: |
      apt update
      apt install -y ca-certificates
      update-ca-certificates
  charm:
    after:
      - update-certificates
    plugin: uv
    source: .
    build-snaps:
      - astral-uv
    build-packages:
      - git
      # s390x: build cryptography (openssl-sys/Rust) from source
      - libssl-dev
      - pkg-config
      - rustc-1.82
      - cargo-1.82
