type: charm
name: placement-k8s
summary: OpenStack placement service
description: |
  OpenStack Placement provides an HTTP service for managing, selecting,
  and claiming providers of classes of inventory representing available
  resources in a cloud.
assumes:
  - k8s-api
  - juju >= 3.1
links:
  source:
    - https://opendev.org/openstack/charm-placement-k8s
  issues:
    - https://bugs.launchpad.net/charm-placement-k8s

base: ubuntu@24.04
platforms:
  amd64:
  arm64:
  s390x:

config:
  options:
    debug:
      default: false
      description: Enable debug logging.
      type: boolean
    region:
      default: RegionOne
      description: Name of the OpenStack region
      type: string

actions:
  validate-config-overrides:
    description: |
      Validate a service configuration override file without applying it.
    params:
      content:
        type: string
        default: ""
        description: Override file content to validate.
  get-config-overrides:
    description: Report the service configuration overrides in effect.
  apply-config-overrides:
    description: Validate the attached override resources and apply them now.
  pause:
    description: Pause container services
    additionalProperties: false
  resume:
    description: Resume container services
    additionalProperties: false

containers:
  placement-api:
    resource: placement-api-image

resources:
  placement-api-image:
    type: oci-image
    description: OCI image for OpenStack Placement
    upstream-source: ghcr.io/canonical/placement-api:2026.1-24.04_edge
  config-override:
    type: file
    filename: override.conf
    description: Optional oslo.config drop-in override for placement-api.

requires:
  database:
    interface: mysql_client
    limit: 1
  identity-service:
    interface: keystone
  ingress-internal:
    interface: ingress
    limit: 1
  ingress-public:
    interface: ingress
    optional: true
    limit: 1
  receive-ca-cert:
    interface: certificate_transfer
    optional: true
  logging:
    interface: loki_push_api
    optional: true
  tracing:
    interface: tracing
    optional: true
    limit: 1

provides:
  placement:
    interface: placement

peers:
  peers:
    interface: placement-peer

parts:
  update-certificates:
    plugin: nil
    override-build: |
      apt update
      apt install -y ca-certificates
      update-ca-certificates
  charm:
    after:
      - update-certificates
    plugin: uv
    source: .
    build-snaps:
      - astral-uv
    build-packages:
      - git
      # s390x: build cryptography (openssl-sys/Rust) from source
      - libssl-dev
      - pkg-config
      - rustc-1.82
      - cargo-1.82
