type: charm
name: epa-orchestrator
title: Epa Orchestrator
summary: Deploy the epa-orchestrator snap.
description: |
  Configures the epa-orchestrator snap as a part of the openstack deployment.
assumes:
  - juju >= 3.1
base: ubuntu@24.04
subordinate: true
platforms:
  amd64:
  arm64:
  s390x:
config:
  options:
    snap-name:
      default: epa-orchestrator
      type: string
      description: The name of the snap to install.
    snap-channel:
      default: 2026.1/edge
      type: string
      description: |
        Snap channel to track. A risk change within the same track (e.g.
        stable to candidate) refreshes the snap on the next hook run.
        A track change does NOT refresh the snap from a hook — use the
        refresh-snap action (optionally with a channel parameter).
requires:
  sunbeam-machine:
    interface: sunbeam-machine
    scope: container
    limit: 1
  tracing:
    interface: tracing
    optional: true
    limit: 1

actions:
  refresh-snap:
    description: |
      Refresh the snap to the latest available revision on the configured
      channel. The snap is held after installation to prevent automatic
      refreshes; use this action to apply updates explicitly. Overrides
      the snap-channel config for this refresh if specified.
    params:
      channel:
        type: string
        description: Channel override for this refresh; defaults to snap-channel.

parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv
    build-packages:
      - git
      # s390x: build cryptography (openssl-sys/Rust) from source
      - libssl-dev
      - pkg-config
      - rustc-1.82
      - cargo-1.82
