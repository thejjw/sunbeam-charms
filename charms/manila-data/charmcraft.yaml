type: charm
name: manila-data
summary: OpenStack Shared Filesystems service (manila-data)
description: |
  Manila is the OpenStack project that provides shared filesystems as a
  service for instances. This charm provides and integrates the manila-data
  service.
assumes:
  - juju >= 3.1
links:
  source: https://opendev.org/openstack/sunbeam-charms
  issues: https://bugs.launchpad.net/sunbeam-charms

base: ubuntu@24.04
platforms:
  amd64:
  arm64:
  s390x:

config:
  options:
    debug:
      type: boolean
      default: false
      description: Enable debug logging.
    snap-name:
      default: manila-data
      type: string
      description: Name of the snap to install.
    snap-channel:
      default: 2026.1/edge
      type: string
      description: |
        Snap channel to track. A risk change within the same track (e.g.
        stable to candidate) refreshes the snap on the next hook run.
        A track change does NOT refresh the snap from a hook — use the
        refresh-snap action (optionally with a channel parameter).
    enable-telemetry-notifications:
      type: boolean
      default: false
      description: Enable notifications to send to telemetry.

requires:
  amqp:
    interface: rabbitmq
    limit: 1
  database:
    interface: mysql_client
    limit: 1
  identity-credentials:
    interface: keystone-credentials
    limit: 1
  receive-ca-cert:
    interface: certificate_transfer
    optional: true
  logging:
    interface: loki_push_api
    optional: true
    limit: 1
  tracing:
    interface: tracing
    optional: true
    limit: 1

actions:
  refresh-snap:
    description: |
      Refresh the snap to the latest available revision on the configured
      channel. The snap is held after installation to prevent automatic
      refreshes; use this action to apply updates explicitly. Overrides
      the snap-channel config for this refresh if specified.
    params:
      channel:
        type: string
        description: Channel override for this refresh; defaults to snap-channel.

parts:
  update-certificates:
    plugin: nil
    override-build: |
      apt update
      apt install -y ca-certificates
      update-ca-certificates
  charm:
    after:
      - update-certificates
    plugin: uv
    source: .
    build-snaps:
      - astral-uv
    build-packages:
      - git
      # s390x: build cryptography (openssl-sys/Rust) from source
      - libssl-dev
      - pkg-config
      - rustc-1.82
      - cargo-1.82
