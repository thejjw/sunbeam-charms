type: charm
name: openstack-exporter-k8s
summary: OpenStack openstack-exporter service
description: |
  OpenStack openstack-exporter provides endpoint metrics for OpenStack services.
assumes:
  - k8s-api
  - juju >= 3.1
links:
  source:
    - https://opendev.org/openstack/charm-openstack-exporter-k8s
  issues:
    - https://bugs.launchpad.net/charm-openstack-exporter-k8s

platforms:
  noble-amd64:
    build-on: [ubuntu@24.04:amd64]
    build-for: [ubuntu@24.04:amd64]
  noble-arm64:
    build-on: [ubuntu@24.04:arm64]
    build-for: [ubuntu@24.04:arm64]
  noble-s390x:
    build-on: [ubuntu@24.04:s390x]
    build-for: [ubuntu@24.04:s390x]
  resolute-amd64:
    build-on: [ubuntu@26.04:amd64]
    build-for: [ubuntu@26.04:amd64]
  resolute-arm64:
    build-on: [ubuntu@26.04:arm64]
    build-for: [ubuntu@26.04:arm64]
  resolute-s390x:
    build-on: [ubuntu@26.04:s390x]
    build-for: [ubuntu@26.04:s390x]

config:
  options:
    region:
      default: RegionOne
      description: Name of the OpenStack region
      type: string

containers:
  openstack-exporter:
    resource: openstack-exporter-image

resources:
  openstack-exporter-image:
    type: oci-image
    description: OCI image for OpenStack openstack-exporter
    upstream-source: ghcr.io/canonical/openstack-exporter:1.7.0-3be9ddb-bare_edge

requires:
  identity-ops:
    interface: keystone-resources
  receive-ca-cert:
    interface: certificate_transfer
    optional: true
  logging:
    interface: loki_push_api
    optional: true
  tracing:
    interface: tracing
    optional: true
    limit: 1

provides:
  metrics-endpoint:
    interface: prometheus_scrape
  grafana-dashboard:
    interface: grafana_dashboard

peers:
  peers:
    interface: openstack-exporter-peer

parts:
  update-certificates:
    plugin: nil
    override-build: |
      apt update
      apt install -y ca-certificates
      update-ca-certificates
  charm:
    after:
      - update-certificates
    plugin: uv
    source: .
    build-snaps:
      - astral-uv
    build-packages:
      - git
      # s390x: build cryptography (openssl-sys/Rust) from source
      - libssl-dev
      - pkg-config
      - rustc-1.91
      - cargo-1.91
