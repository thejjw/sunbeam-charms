type: charm
title: Sunbeam common libraries
name: sunbeam-libs
summary: Sunbeam common libraries
description: |
  Placeholder for the common libraries used in Sunbeam.
assumes:
  - k8s-api
links:
  source: https://opendev.org/openstack/sunbeam-charms
  issues: https://bugs.launchpad.net/sunbeam-charms

base: ubuntu@24.04
platforms:
  amd64:
  arm64:
  s390x:

actions:
  pre-upgrade:
    description: |
      Prepare the charm for an upgrade.
      Run this action on the leader before upgrading the charm to a new channel.
  post-upgrade:
    description: |
      Clean up after an upgrade.
      Run this action on the leader after all units are healthy at the new version.

containers:
  placeholder:
    resource: placeholder-image

resources:
  placeholder-image:
    description: OCI image for placeholder
    type: oci-image
    upstream-source: busybox
