bundle: kubernetes

applications:
  traefik:
    charm: ch:traefik-k8s
    channel: latest/candidate
    base: ubuntu@26.04
    scale: 1
    trust: true
  traefik-public:
    charm: ch:traefik-k8s
    channel: latest/candidate
    base: ubuntu@26.04
    scale: 1
    trust: true
    options:
      kubernetes-service-annotations: metallb.universe.tf/address-pool=public
  mysql:
    charm: ch:mysql-k8s
    channel: 8.0/stable
    base: ubuntu@22.04
    scale: 1
    trust: true
    options:
      profile-limit-memory: 6202
      experimental-max-connections: 466
  rabbitmq:
    charm: ch:rabbitmq-k8s
    channel: 4.0/edge
    base: ubuntu@24.04
    scale: 1
    trust: true
    options:
      minimum-replicas: 1
  keystone:
    charm: ch:keystone-k8s
    channel: 2026.2/edge
    base: ubuntu@26.04
    scale: 1
    trust: true
    storage:
      fernet-keys: 5M
      credential-keys: 5M
  glance:
    charm: ch:glance-k8s
    channel: 2026.2/edge
    base: ubuntu@26.04
    scale: 1
    trust: true
    storage:
      local-repository: 10G
  nova:
    charm: ch:nova-k8s
    channel: 2026.2/edge
    base: ubuntu@26.04
    scale: 1
    trust: true
  placement:
    charm: ch:placement-k8s
    channel: 2026.2/edge
    base: ubuntu@26.04
    scale: 1
    trust: true
  neutron:
    charm: ch:neutron-k8s
    channel: 2026.2/edge
    base: ubuntu@26.04
    scale: 1
    trust: true
  vault:
    charm: ch:icey-vault-k8s
    channel: stable
    scale: 1
    resources:
      vault-image: vault

relations:
- - mysql:database
  - keystone:database
- - traefik:ingress
  - keystone:ingress-internal
- - traefik-public:ingress
  - keystone:ingress-public

- - mysql:database
  - glance:database
- - rabbitmq:amqp
  - glance:amqp
- - keystone:identity-service
  - glance:identity-service
- - traefik:ingress
  - glance:ingress-internal
- - traefik-public:ingress
  - glance:ingress-public

- - mysql:database
  - nova:database
- - mysql:database
  - nova:api-database
- - mysql:database
  - nova:cell-database
- - rabbitmq:amqp
  - nova:amqp
- - keystone:identity-service
  - nova:identity-service
- - traefik:ingress
  - nova:ingress-internal
- - traefik-public:ingress
  - nova:ingress-public

- - mysql:database
  - placement:database
- - keystone:identity-service
  - placement:identity-service
- - traefik:ingress
  - placement:ingress-internal
- - traefik-public:ingress
  - placement:ingress-public

- - mysql:database
  - neutron:database
- - rabbitmq:amqp
  - neutron:amqp
- - keystone:identity-service
  - neutron:identity-service
- - traefik:ingress
  - neutron:ingress-internal
- - traefik-public:ingress
  - neutron:ingress-public
- - vault:insecure-certificates
  - neutron:certificates
