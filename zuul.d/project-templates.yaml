        - charm-build-bin-infra: *functional_charm_artifacts
        - charm-build-bin-infra-noble: *functional_charm_artifacts
        - charm-build-bin-storage-a
        - charm-build-bin-storage-a-noble
        - charm-build-bin-storage-b
        - charm-build-bin-storage-b-noble
        - charm-build-bin-storage-c
        - charm-build-bin-storage-c-noble
        - charm-build-bin-storage-d
        - charm-build-bin-storage-d-noble
        - charm-build-bin-storage-e
        - charm-build-bin-storage-e-noble
