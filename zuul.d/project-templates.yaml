- project-template:
    name: openstack-python3-sunbeam-jobs
    # NOTE(hemanth): This template is used in openstack sunbeam charms since
    # stable/2023.1. The stable/2023.1 and stable/2023.2 charm branches
    # support py310 unit tests and main support py310, py312 tests.
    description: |
      Runs unit tests for an OpenStack Sunbeam project under the CPython
      version 3 releases designated for testing the latest release.
    check:
      jobs:
        - openstack-tox-linters
        - openstack-tox-pep8
        - openstack-tox-py310:
            branches:
              - stable/2023.1
              - stable/2023.2
        - openstack-tox-py312:
            branches:
              - main
              - stable/2024.1
    gate:
      jobs:
        - openstack-tox-linters
        - openstack-tox-pep8
        - openstack-tox-py310:
            branches:
              - stable/2023.1
              - stable/2023.2
        - openstack-tox-py312:
            branches:
              - main
              - stable/2024.1

- project-template:
    name: openstack-sunbeam-charm-build-jobs
    description: |
      Build the charms in OpenStack Sunbeam project.
    check:
      fail-fast: true
      jobs:
        # Functional suites need a complete set of local charms for their base.
        - charm-build-bin-core-identity: &functional_charm_artifacts
            files:
              - '^rebuild$'
              - 'charms/aodh-k8s/'
              - 'charms/barbican-k8s/'
              - 'charms/ceilometer-k8s/'
              - 'charms/cinder-k8s/'
              - 'charms/cinder-volume/'
              - 'charms/cloudkitty-k8s/'
              - 'charms/designate-bind-k8s/'
              - 'charms/designate-k8s/'
              - 'charms/epa-orchestrator/'
              - 'charms/glance-k8s/'
              - 'charms/gnocchi-k8s/'
              - 'charms/heat-k8s/'
              - 'charms/horizon-k8s/'
              - 'charms/ironic-conductor-k8s/'
              - 'charms/ironic-k8s/'
              - 'charms/keystone-k8s/'
              - 'charms/keystone-ldap-k8s/'
              - 'charms/keystone-saml-k8s/'
              - 'charms/magnum-k8s/'
              - 'charms/manila-cephfs-k8s/'
              - 'charms/manila-data/'
              - 'charms/manila-k8s/'
              - 'charms/masakari-k8s/'
              - 'charms/neutron-baremetal-switch-config-k8s/'
              - 'charms/neutron-generic-switch-config-k8s/'
              - 'charms/neutron-k8s/'
              - 'charms/nova-ironic-k8s/'
              - 'charms/nova-k8s/'
              - 'charms/octavia-k8s/'
              - 'charms/openstack-exporter-k8s/'
              - 'charms/openstack-hypervisor/'
              - 'charms/openstack-images-sync-k8s/'
              - 'charms/openstack-network-agents/'
              - 'charms/openstack-port-cni-k8s/'
              - 'charms/placement-k8s/'
              - 'charms/storage/cinder-volume-ceph/'
              - 'charms/sunbeam-clusterd/'
              - 'charms/sunbeam-machine/'
              - 'charms/sunbeam-ovn-proxy/'
