              - 'tests/local/zaza/sunbeam/charm_tests/tempest_k8s/'
              - 'tests/openstack-microovn-ceph/'
              - 'tests/openstack-microovn-core/'
              - 'tests/openstack-microovn-deploy/'
              - 'tests/openstack-microovn-services/'
            vars:
              charm_build_complete_bin: true
        - charm-build-bin-core-identity-noble: *functional_charm_artifacts
        - charm-build-bin-core-compute: *functional_charm_artifacts
        - charm-build-bin-core-compute-noble: *functional_charm_artifacts
        - charm-build-bin-core-ovn
