- name: test runner packages are installed
  apt:
    name:
      - jq
  become: true
- name: Install sosreport
  ansible.builtin.command: "snap install sosreport --channel={{ sosreport_channel }}{% if sosreport_classic_mode | default(true) | bool %} --classic{% endif %}"
  become: true
  register: sosreport_snap_result
  changed_when: "'already installed' not in sosreport_snap_result.stderr"
  failed_when: >
    sosreport_snap_result.rc != 0 and
    'already installed' not in sosreport_snap_result.stderr
  retries: 5
  delay: 15
  until: not sosreport_snap_result.failed
- name: Create destination for logs
  file:
    path: "{{ zuul.project.src_dir }}/log"
    state: directory
    mode: 0755
- name: collect disk usage
  shell: df -h > {{ zuul.project.src_dir }}/log/df.txt
- name: collect mount list
  shell: mount > {{ zuul.project.src_dir }}/log/mount.txt
- name: debug logs replay for all models
  args:
    executable: /bin/bash
  shell: |
    set -o pipefail
    for model in $(juju models --format=json | jq -r '.models[]["short-name"]'); do
      juju debug-log --replay -m "$model" > "{{ zuul.project.src_dir }}/log/debug-hooks-$model.txt" || echo "WARN: debug-log failed for model $model"
    done
    exit 0
- name: juju status
  args:
    executable: /bin/bash
  shell: |
    set -o pipefail
    for model in $(juju models --format=json | jq -r '.models[]["short-name"]'); do
      juju status -m "$model" > "{{ zuul.project.src_dir }}/log/juju-status.$model.txt" || echo "WARN: juju status failed for model $model"
      juju status -m "$model" --format=yaml > "{{ zuul.project.src_dir }}/log/juju-status.$model.yaml" || true
    done
- name: Collect units' info for all models
  args:
    executable: /bin/bash
  shell: |
    set -o pipefail
    set -x
    LOG_FOLDER={{ zuul.project.src_dir }}/log/unit-info/
    mkdir -p $LOG_FOLDER
    for model in $(juju models --format=json | jq -r '.models[]["short-name"]'); do
      # .units // {} guards machine-only apps; keys[] collects all units, not just the first
      for unit in $(juju status -m "$model" --format json 2>/dev/null | jq -r '[.applications[] | .units // {} | keys[]] | join("\n")'); do
        echo Collecting unit info: $unit
        unit_name=$(echo $unit | tr / -)
        juju show-unit -m "$model" --output="$LOG_FOLDER/$unit_name.yaml" "$unit" || echo "WARN: show-unit failed for $unit"
      done
    done
- name: Include k8s tasks
  include_tasks: k8s.yaml
  when: env_type == 'k8s'
- name: Collect sos report
  args:
    executable: /bin/bash
  shell: |
    sudo sosreport.sos report -k networking.timeout=600 --batch --tmp-dir {{ zuul.project.src_dir }}/log/
    sudo chmod 0755 {{ zuul.project.src_dir }}/log/sosreport-*.tar.xz
    sudo chmod 0755 {{ zuul.project.src_dir }}/log/sosreport-*.tar.xz.sha256
- name: fetch juju logs
  synchronize:
    dest: "{{ zuul.executor.log_root }}"
    mode: pull
    src: "{{ zuul.project.src_dir }}/log"
    verify_host: true
    owner: false
    group: false
