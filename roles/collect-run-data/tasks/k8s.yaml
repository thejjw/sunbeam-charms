- name: collect k8s logs
  args:
    executable: /bin/bash
  shell: |
    snap logs -n all k8s > "{{ zuul.project.src_dir }}/log/k8s-logs.txt"
  become: true
  failed_when: false
- name: get main resources state
  args:
    executable: /bin/bash
  shell: |
    k8s kubectl get all --all-namespaces > "{{ zuul.project.src_dir }}/log/k8s-get-all.txt"
  become: true
  failed_when: false
- name: debug describe resources
  args:
    executable: /bin/bash
  shell: |
    set -o pipefail
    sudo k8s kubectl describe nodes > {{ zuul.project.src_dir }}/log/describe-nodes.txt || true
    sudo k8s kubectl describe pods -n kube-system > {{ zuul.project.src_dir }}/log/describe-pods-kube-system.txt || true
    for MODEL in $(juju models --format=json | jq -r '.models[]["short-name"]'); do
      sudo k8s kubectl get ns "$MODEL" &>/dev/null || continue
      sudo k8s kubectl describe -n "$MODEL" pods > "{{ zuul.project.src_dir }}/log/describe-pods-$MODEL.txt" || true
    done
    for NS in $(sudo k8s kubectl get ns -o jsonpath='{.items[*].metadata.name}' | tr ' ' '\n' | grep -i controller); do
      sudo k8s kubectl describe -n "$NS" pods > "{{ zuul.project.src_dir }}/log/describe-pods-$NS.txt" || true
    done
    exit 0
- name: Collect pods logs
  args:
    executable: /bin/bash
  shell: |
    set -o pipefail
    LOG_FOLDER={{ zuul.project.src_dir }}/log/pods/
    mkdir -p $LOG_FOLDER
    sudo k8s kubectl logs -n kube-system deployment/coredns --all-containers > $LOG_FOLDER/coredns.log
    for MODEL_NAME in $(juju models --format=json | jq -r '.models[]["short-name"]'); do
      sudo k8s kubectl get ns "$MODEL_NAME" &>/dev/null || continue
      mkdir -p "$LOG_FOLDER/$MODEL_NAME"
      for pod in $(sudo k8s kubectl get pods -n "$MODEL_NAME" -o=jsonpath='{.items[*].metadata.name}');
      do
        echo Collecting logs: $pod
        # one file per container: --all-containers merges with no delimiter
        for container in $(sudo k8s kubectl get pods -n "$MODEL_NAME" "$pod" -o=jsonpath='{.spec.containers[*].name}'); do
          sudo k8s kubectl logs --ignore-errors -n "$MODEL_NAME" -c "$container" "$pod" > "$LOG_FOLDER/$MODEL_NAME/$pod-$container.log" || true
          sudo k8s kubectl logs --ignore-errors -p -n "$MODEL_NAME" -c "$container" "$pod" > "$LOG_FOLDER/$MODEL_NAME/$pod-$container.previous.log" 2>/dev/null || true
        done
      done
    done
